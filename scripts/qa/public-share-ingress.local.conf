# QA template ONLY. Not installed/deployed. Requires actual nginx -t/TLS/topology QA.
# Origin MUST listen only on 127.0.0.1 with no other public route to its socket.
# No real cert paths, keys, upstream credentials or source values are included.
worker_processes 1;
events { worker_connections 128; }
http {
  map $request_method $safe_method { default OTHER; GET GET; HEAD HEAD; OPTIONS OPTIONS; POST POST; PUT PUT; PATCH PATCH; DELETE DELETE; }
  map $uri $safe_route { default Other; ~^/share/[^/]+/media$ Media; ~^/share/[^/]+$ Page; }
  log_format public_qa escape=json '{"route":"$safe_route","method":"$safe_method","status":$status}';
  access_log logs/public-qa-aggregate.log public_qa;
  # Do not persist parser/upstream errors containing raw bearer URLs in this QA template.
  error_log /dev/null crit;
  limit_req_zone $server_name zone=global_requests:1m rate=40r/s;
  limit_req_zone $binary_remote_addr zone=source_requests:4m rate=8r/s;
  limit_conn_zone $server_name zone=global_media:1m;
  limit_conn_zone $binary_remote_addr zone=source_media:4m;
  server {
    listen 127.0.0.1:9443 ssl;
    server_name isolated-public-share-qa;
    ssl_certificate QA_CERTIFICATE_REQUIRED;
    ssl_certificate_key QA_PRIVATE_KEY_REQUIRED;
    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_header_timeout 5s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 10s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=global_requests burst=80 nodelay;
    limit_req zone=source_requests burst=40 nodelay;
    location ~ ^/share/[^/]+/media$ {
      limit_conn global_media 8;
      limit_conn source_media 2;
      limit_rate 1m;
      proxy_buffering off;
      proxy_hide_header Cache-Control;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header X-Robots-Tag;
      proxy_hide_header X-Content-Type-Options;
      proxy_pass http://127.0.0.1:4328;
      proxy_set_header X-QSC-QA-Source $remote_addr;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Real-IP "";
    }
    location / { return 503; }
  }
}
