# Private P6 QA template; never production configuration. Render ONLY inside an
# owned ignored directory (0750); use the same trusted QA service UID/group.
# Real TLS/nginx -t/HTTP2/redaction qualification is required on the Linux target.
worker_processes 1;
pid __QA_RUN_DIRECTORY__/nginx.pid;
error_log /dev/null crit;
events { worker_connections 128; }
http {
  server_tokens off;
  client_body_temp_path __QA_RUN_DIRECTORY__/client-body;
  proxy_temp_path __QA_RUN_DIRECTORY__/proxy-temp;
  fastcgi_temp_path __QA_RUN_DIRECTORY__/fastcgi-temp;
  uwsgi_temp_path __QA_RUN_DIRECTORY__/uwsgi-temp;
  scgi_temp_path __QA_RUN_DIRECTORY__/scgi-temp;
  map $request_method $qa_method { default OTHER; GET GET; HEAD HEAD; OPTIONS OPTIONS; POST POST; PUT PUT; PATCH PATCH; DELETE DELETE; }
  map $uri $qa_route { default Other; ~^/share/[^/]+/media$ Media; ~^/share/[^/]+$ Page; }
  log_format qa_safe escape=json '{"route":"$qa_route","method":"$qa_method","status":$status}';
  access_log __QA_RUN_DIRECTORY__/nginx-safe.log qa_safe;
  limit_req_zone $server_name zone=global_requests:1m rate=40r/s;
  limit_req_zone $binary_remote_addr zone=source_requests:4m rate=8r/s;
  limit_conn_zone $server_name zone=global_media:1m;
  limit_conn_zone $binary_remote_addr zone=source_media:4m;
  upstream p6_private {
    server unix:__QA_RUN_DIRECTORY__/worker-1.sock;
    __QA_SECOND_WORKER__
    # Never replay an uncertain original operation on another worker.
  }
  server {
    listen 127.0.0.1:9443 ssl;
    http2 on;
    server_name isolated-public-share-qa;
    ssl_certificate __QA_RUN_DIRECTORY__/tls.crt;
    ssl_certificate_key __QA_RUN_DIRECTORY__/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_header_timeout 5s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 10s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=global_requests burst=80 nodelay;
    limit_req zone=source_requests burst=40 nodelay;
    error_page 429 = @qa_denied;
    location @qa_denied {
      internal;
      add_header Retry-After 1 always;
      add_header Cache-Control "private, no-store" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header X-Content-Type-Options "nosniff" always;
      return 429 "";
    }
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Robots-Tag;
    proxy_hide_header X-Content-Type-Options;
    proxy_set_header X-QSC-QA-Source $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Referer "";
    location ~ ^/share/[^/]+/media$ {
      limit_conn global_media 8;
      limit_conn source_media 2;
      limit_rate 1m;
      proxy_pass http://p6_private;
    }
    location ~ ^/share/[^/]+$ { proxy_pass http://p6_private; }
    # No configuration, metrics, reset, recovery, initialization or control URL.
    location / { return 503; }
  }
}
